<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3677fb"/>
      <stop offset="100%" style="stop-color:#1242b8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="256" rx="112" ry="112" fill="url(#shine)"/>

  <!-- Book body -->
  <rect x="128" y="144" width="256" height="224" rx="18" ry="18" fill="#ffffff" opacity="0.15"/>
  <rect x="136" y="152" width="240" height="208" rx="14" ry="14" fill="#ffffff"/>

  <!-- Book spine line -->
  <line x1="256" y1="152" x2="256" y2="360" stroke="#d1deff" stroke-width="3"/>

  <!-- Left page lines -->
  <rect x="155" y="185" width="85" height="8" rx="4" fill="#2563eb" opacity="0.5"/>
  <rect x="155" y="205" width="75" height="7" rx="3.5" fill="#2563eb" opacity="0.35"/>
  <rect x="155" y="222" width="80" height="7" rx="3.5" fill="#2563eb" opacity="0.35"/>
  <rect x="155" y="239" width="68" height="7" rx="3.5" fill="#2563eb" opacity="0.25"/>
  <rect x="155" y="256" width="78" height="7" rx="3.5" fill="#2563eb" opacity="0.25"/>
  <rect x="155" y="273" width="60" height="7" rx="3.5" fill="#2563eb" opacity="0.2"/>
  <rect x="155" y="290" width="72" height="7" rx="3.5" fill="#2563eb" opacity="0.2"/>
  <rect x="155" y="307" width="55" height="7" rx="3.5" fill="#2563eb" opacity="0.15"/>

  <!-- Right page lines -->
  <rect x="272" y="185" width="85" height="8" rx="4" fill="#2563eb" opacity="0.5"/>
  <rect x="272" y="205" width="70" height="7" rx="3.5" fill="#2563eb" opacity="0.35"/>
  <rect x="272" y="222" width="82" height="7" rx="3.5" fill="#2563eb" opacity="0.35"/>
  <rect x="272" y="239" width="65" height="7" rx="3.5" fill="#2563eb" opacity="0.25"/>
  <rect x="272" y="256" width="75" height="7" rx="3.5" fill="#2563eb" opacity="0.25"/>
  <rect x="272" y="273" width="58" height="7" rx="3.5" fill="#2563eb" opacity="0.2"/>
  <rect x="272" y="290" width="80" height="7" rx="3.5" fill="#2563eb" opacity="0.2"/>
  <rect x="272" y="307" width="50" height="7" rx="3.5" fill="#2563eb" opacity="0.15"/>

  <!-- Bookmark ribbon (top right of book) -->
  <polygon points="340,152 370,152 370,220 355,205 340,220" fill="#4ade80"/>
  <!-- Bookmark shine -->
  <polygon points="340,152 370,152 370,168 340,168" fill="#ffffff" opacity="0.25"/>
</svg>
