<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3677fb"/>
      <stop offset="100%" style="stop-color:#1242b8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Icon background rounded square -->
  <rect x="0" y="12" width="136" height="136" rx="30" ry="30" fill="url(#bg)"/>
  <rect x="0" y="12" width="136" height="68" rx="30" ry="30" fill="url(#shine)"/>

  <!-- Book body -->
  <rect x="18" y="36" width="100" height="88" rx="8" ry="8" fill="#ffffff" opacity="0.15"/>
  <rect x="21" y="39" width="94" height="82" rx="6" ry="6" fill="#ffffff"/>

  <!-- Book spine -->
  <line x1="68" y1="39" x2="68" y2="121" stroke="#d1deff" stroke-width="2"/>

  <!-- Left page lines -->
  <rect x="29" y="52" width="32" height="5" rx="2.5" fill="#2563eb" opacity="0.5"/>
  <rect x="29" y="61" width="28" height="4" rx="2" fill="#2563eb" opacity="0.3"/>
  <rect x="29" y="69" width="30" height="4" rx="2" fill="#2563eb" opacity="0.3"/>
  <rect x="29" y="77" width="24" height="4" rx="2" fill="#2563eb" opacity="0.2"/>
  <rect x="29" y="85" width="29" height="4" rx="2" fill="#2563eb" opacity="0.2"/>
  <rect x="29" y="93" width="20" height="4" rx="2" fill="#2563eb" opacity="0.15"/>
  <rect x="29" y="101" width="26" height="4" rx="2" fill="#2563eb" opacity="0.15"/>

  <!-- Right page lines -->
  <rect x="75" y="52" width="32" height="5" rx="2.5" fill="#2563eb" opacity="0.5"/>
  <rect x="75" y="61" width="26" height="4" rx="2" fill="#2563eb" opacity="0.3"/>
  <rect x="75" y="69" width="30" height="4" rx="2" fill="#2563eb" opacity="0.3"/>
  <rect x="75" y="77" width="22" height="4" rx="2" fill="#2563eb" opacity="0.2"/>
  <rect x="75" y="85" width="28" height="4" rx="2" fill="#2563eb" opacity="0.2"/>
  <rect x="75" y="93" width="18" height="4" rx="2" fill="#2563eb" opacity="0.15"/>
  <rect x="75" y="101" width="25" height="4" rx="2" fill="#2563eb" opacity="0.15"/>

  <!-- Bookmark ribbon -->
  <polygon points="99,39 115,39 115,72 107,63 99,72" fill="#4ade80"/>
  <polygon points="99,39 115,39 115,47 99,47" fill="#ffffff" opacity="0.25"/>

  <!-- Wordmark: SVVV_ -->
  <text x="156" y="92" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="60" letter-spacing="-3" fill="#17233d">SVVV_</text>
  <!-- Wordmark: Notes (blue) -->
  <text x="386" y="92" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="60" letter-spacing="-3" fill="#2563eb">Notes</text>

  <!-- Tagline -->
  <text x="157" y="118" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="18" fill="#6e7890" letter-spacing="0.3">Study smarter, together.</text>
</svg>
